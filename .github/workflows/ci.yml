name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete
      - name: Release build
        run: swift build -c release -Xswiftc -strict-concurrency=complete
